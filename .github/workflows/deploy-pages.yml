name: Deploy UI Mockups to Github Pages

on:
    push:
        branches:
            - main
        paths:
            - "ui-mockups/**"
            - ".github/workflows/deploy-pages.yml"

    workflow_dispatch:


permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

    defaults:
        run:
            working-directory: ui-mockups

    steps:
        - name: Checkout
            uses: actions/setup-node@v4

        - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
                node-version: 22
                cache: npm
                cache-dependency-path: ui-mockups/package-lock.json

        - name: Install dependencies
            run: npm ci

        - name: Build website
            run: npm run build

        - name: Upload Pages artifact
            uses: actions/upload-pages-artifact@v3
            with:
                path: ui-mockups/dist


    deploy:
        environment:
            name: githup-pages
            url: ${{ steps.deployment.outputs.page.url }}

        runs-on: ubuntu-latest
        needs: build

        permissions:
            pages: write
            id-token: write

        steps:
        - name: Deploy to Github Pages
            id: deployment
            uses: actions/deploy-pages@v4



